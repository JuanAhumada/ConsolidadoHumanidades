<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Iniciar sesión · Humanidades</title>
  <link rel="icon" type="image/png" href="/static/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/app.css"/>
</head>
<body class="page-login" data-ayuda="{{ ayuda_clave or 'login' }}">
  <div class="page-tools" role="toolbar" aria-label="Navegación y ayuda">
    <button type="button" class="page-tool" id="nav-atras" title="Atrás" aria-label="Atrás" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 6 9 12l6 6"/></svg>
    </button>
    <button type="button" class="page-tool" id="nav-adelante" title="Adelante" aria-label="Adelante" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button type="button" class="page-tool page-tool-help" id="btn-ayuda" title="Ayuda de esta pantalla" aria-label="Ayuda de esta pantalla" aria-expanded="false" aria-controls="ayuda-panel">?</button>
  </div>
  <main class="login-shell">
    <section class="login-card">
      <header class="login-brand">
        <img class="login-logo" src="/static/favicon.png" alt="" width="64" height="64"/>
        <p class="login-kicker">Consolidado académico</p>
        <h1>Humanidades</h1>
        <p class="login-lead">Inicie sesión para continuar</p>
      </header>
      <form class="login-form" method="post" action="/login">
        <input type="hidden" name="siguiente" value="{{ siguiente or '/' }}"/>
        {% if flash %}
        <article class="flash-card ok" role="status">
          <span class="flash-card-mark" aria-hidden="true">✓</span>
          <div><strong>Listo</strong><p>{{ flash }}</p></div>
        </article>
        {% endif %}
        {% if error %}
        <article class="flash-card err" role="alert">
          <span class="flash-card-mark" aria-hidden="true">!</span>
          <div><strong>No se pudo completar</strong><p>{{ error }}</p></div>
        </article>
        {% endif %}
        <div class="field">
          <label for="usuario">Usuario</label>
          <input id="usuario" type="text" name="usuario" required autocomplete="username" autofocus placeholder="Su usuario"/>
        </div>
        <div class="field">
          <label for="clave">Contraseña</label>
          <input id="clave" type="password" name="clave" required autocomplete="current-password" placeholder="••••••••"/>
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </section>
  </main>
  {% include "_ayuda.html" %}
</body>
</html>
